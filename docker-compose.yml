version: '3.8'

services:
  # --- POSTGRES SERVICE ---
  postgres:
    image: postgres:16
    container_name: postgres-ghostwriter
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

# Shared resources block
volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
